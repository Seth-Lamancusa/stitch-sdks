[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stitchai"
version = "0.1.0"
description = "Python SDK for Stitch API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stitchai"]

